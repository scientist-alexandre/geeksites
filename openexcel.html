  function usedPrintRange(){
    let minRow=Infinity,minCol=Infinity,maxRow=0,maxCol=0;

    for(const [k,d] of Object.entries(state.cells)){
      if(!d) continue;
      const raw=String(d.raw??'');

      // Como no Excel: a área de impressão automática é definida pelas
      // células realmente usadas (valor ou fórmula). Formatação aplicada a
      // células vazias não deve criar páginas ou ampliar o PDF.
      if(raw!==''){
        const [r,c]=k.split(':').map(Number);
        minRow=Math.min(minRow,r);
        minCol=Math.min(minCol,c);
        maxRow=Math.max(maxRow,r);
        maxCol=Math.max(maxCol,c);
      }
    }

    if(maxRow===0 || maxCol===0){
      return {r1:1,c1:1,r2:1,c2:1};
    }

    return {r1:minRow,c1:minCol,r2:maxRow,c2:maxCol};
  }

  function pageMm(){
    const sizes={
      A4:[210,297],
      A3:[297,420],
      Carta:[216,279],
      Ofício:[216,356]
    };
    let [w,h]=sizes[state.pageSize]||sizes.A4;
    if(state.orientation==='landscape') [w,h]=[h,w];
    return {w,h};
  }

  function buildPrintSnapshot(){
    const host=$('#printHost');
    if(!host) return null;

    host.innerHTML='';
    const rg=usedPrintRange();

    const table=document.createElement('table');
    table.className='print-sheet';

    const cg=document.createElement('colgroup');
    let usedWidth=0;

    for(let c=rg.c1;c<=rg.c2;c++){
      const col=document.createElement('col');
      const w=state.colWidths[c]||DEFAULT_COL;
      col.style.width=w+'px';
      cg.appendChild(col);
      usedWidth+=w;
    }
    table.appendChild(cg);

    const tbody=document.createElement('tbody');
    let usedHeight=0;

    for(let r=rg.r1;r<=rg.r2;r++){
      const tr=document.createElement('tr');
      const h=state.rowHeights[r]||DEFAULT_ROW;
      tr.style.height=h+'px';
      usedHeight+=h;

      for(let c=rg.c1;c<=rg.c2;c++){
        const td=document.createElement('td');
        td.textContent=display(r,c);

        const s=style(r,c);
        td.style.fontWeight=s.bold?'700':'';
        td.style.fontStyle=s.italic?'italic':'';
        td.style.textDecoration=s.underline?'underline':'';
        td.style.textAlign=s.align||'';
        td.style.fontFamily=s.fontFamily||'';
        td.style.fontSize=s.fontSize?s.fontSize+'px':'13px';
        td.style.color=s.color||'#000';
        td.style.backgroundColor=s.fill||'#fff';

        // PDF has no worksheet gridlines.
        // Only borders explicitly applied by the user are printed.
        td.style.border='none';
        if(s.bt) td.style.borderTop=s.bt;
        if(s.bb) td.style.borderBottom=s.bb;
        if(s.bl) td.style.borderLeft=s.bl;
        if(s.br) td.style.borderRight=s.br;

        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    host.appendChild(table);

    const {w,h}=pageMm();
    const pxPerMm=96/25.4;
    const printableW=Math.max(20,w-16)*pxPerMm;
    const printableH=Math.max(20,h-16)*pxPerMm;
    const scale=Math.min(
      1,
      printableW/Math.max(1,usedWidth),
      printableH/Math.max(1,usedHeight)
    );

    table.style.transform=`scale(${scale})`;

    const dyn=$('#dynamicPrintStyle');
    if(dyn){
      dyn.textContent=`
        @media print{
          @page{
            size:${state.pageSize==='Carta'?'Letter':state.pageSize==='Ofício'?'Legal':state.pageSize} ${state.orientation};
            margin:8mm;
          }
          #printHost{
            width:${usedWidth*scale}px!important;
            height:${usedHeight*scale}px!important;
            max-width:${printableW}px!important;
            max-height:${printableH}px!important;
            overflow:hidden!important;
            break-after:avoid-page!important;
            page-break-after:avoid!important;
          }
          #printHost .print-sheet{
            break-inside:avoid!important;
            page-break-inside:avoid!important;
          }
        }
      `;
    }

    return {range:rg,scale,usedWidth,usedHeight};
  }

  function restoreOfflineWorkbook(){
    try{
      if(!window.localStorage)return false;
      const raw=window.localStorage.getItem(OFFLINE_STORAGE_KEY);
      if(!raw)return false;
      const x=JSON.parse(raw);
      if(!Array.isArray(x.sheets)||!x.sheets.length)return false;

      state.sheets=x.sheets.map((sh,index)=>({
        name:String(sh.name||('Planilha'+(index+1))),
        cells:sh.cells||{},styles:sh.styles||{},
        colWidths:sh.colWidths||{},rowHeights:sh.rowHeights||{},
        scrollLeft:Number(sh.scrollLeft)||0,scrollTop:Number(sh.scrollTop)||0,
        selected:sh.selected||{row:1,col:1}
      }));
      state.activeSheetIndex=Math.max(0,Math.min(Number(x.activeSheetIndex)||0,state.sheets.length-1));
      state.nextSheetNumber=Math.max(Number(x.nextSheetNumber)||state.sheets.length+1,state.sheets.length+1);
      state.customFunctionDefs=Array.isArray(x.customFunctionDefs)?x.customFunctionDefs:[];
      state.locale=x.locale||'pt-BR';
      state.pageSize=x.pageSize||'A4';
      state.orientation=x.orientation||'portrait';
      state.macroCode=isRemovedDefaultMacro(x.macroCode)?'':String(x.macroCode||state.macroCode);
      state.macroDefs=Array.isArray(x.macroDefs)
        ? sanitizeMacroDefs(x.macroDefs)
        : (x.macroCode&&!isRemovedDefaultMacro(x.macroCode)?[{name:'Macro importada',code:String(x.macroCode)}]:state.macroDefs);

      const sh=state.sheets[state.activeSheetIndex];
      state.cells=sh.cells;state.styles=sh.styles;
      state.colWidths=sh.colWidths;state.rowHeights=sh.rowHeights;
      state.selected={...(sh.selected||{row:1,col:1})};
      compileCustomFunctions();
      return true;
    }catch{return false}
  }

  function openFile(){
    const i=document.createElement('input');
    i.type='file';
    i.accept='.json';

    i.onchange=()=>{
      const f=i.files[0];
      if(!f)return;

      const r=new FileReader();
      r.onload=()=>{
        try{
          const x=JSON.parse(r.result);

          if(Array.isArray(x.sheets) && x.sheets.length){
            state.sheets=x.sheets.map((sh,index)=>({
              name:String(sh.name||('Planilha'+(index+1))),
              cells:sh.cells||{},
              styles:sh.styles||{},
              colWidths:sh.colWidths||{},
              rowHeights:sh.rowHeights||{},
              scrollLeft:Number(sh.scrollLeft)||0,
              scrollTop:Number(sh.scrollTop)||0,
              selected:sh.selected||{row:1,col:1}
            }));
            state.activeSheetIndex=Math.max(0,Math.min(Number(x.activeSheetIndex)||0,state.sheets.length-1));
            state.nextSheetNumber=Math.max(Number(x.nextSheetNumber)||state.sheets.length+1,state.sheets.length+1);
          }else{
            // Arquivos JSON antigos continuam abrindo como Planilha1.
            state.sheets=[{
              name:'Planilha1',
              cells:x.cells||{},
              styles:x.styles||{},
              colWidths:x.colWidths||{},
              rowHeights:x.rowHeights||{},
              scrollLeft:0,
              scrollTop:0,
              selected:{row:1,col:1}
            }];
            state.activeSheetIndex=0;
            state.nextSheetNumber=2;
          }

          state.customFunctionDefs=Array.isArray(x.customFunctionDefs)
            ? x.customFunctionDefs.map(def=>({
                name:String(def.name||'').trim(),
                params:String(def.params||''),
                code:String(def.code||'')
              }))
            : [];
          compileCustomFunctions();

          state.locale=x.locale||'pt-BR';
          state.pageSize=x.pageSize||'A4';
          state.orientation=x.orientation||'portrait';
          state.macroCode=isRemovedDefaultMacro(x.macroCode)?'':String(x.macroCode||state.macroCode);
          state.macroDefs=Array.isArray(x.macroDefs)
            ? sanitizeMacroDefs(x.macroDefs)
            : (x.macroCode&&!isRemovedDefaultMacro(x.macroCode)?[{name:'Macro importada',code:String(x.macroCode)}]:[]);

          const sh=state.sheets[state.activeSheetIndex];
          state.cells=sh.cells;
          state.styles=sh.styles;
          state.colWidths=sh.colWidths;
          state.rowHeights=sh.rowHeights;
          state.selected={...(sh.selected||{row:1,col:1})};

          build();
          renderSheetTabs();

          requestAnimationFrame(()=>{
            wrap.scrollLeft=sh.scrollLeft||0;
            wrap.scrollTop=sh.scrollTop||0;
            renderVirtualRows(true);
            refreshSelection();
            loadFx();
          });

          $('#decimalKey').textContent=decimalSep();
          $('#decimalKey').dataset.key=decimalSep();
          markOfflineDirty();
          status.textContent=sh.name;
        }catch{
          alert('Arquivo inválido');
        }
      };
      r.readAsText(f);
    };

    i.click();
  }

  function macroApi(){
    const cellForSheet=(sh,a)=>{
      const p=parseAddr(a);
      if(!p)throw Error('Célula inválida');
      return {
        get value(){return String(sh.cells?.[key(p.row,p.col)]?.raw??'')},
        set value(v){
          sh.cells=sh.cells||{};
          sh.cells[key(p.row,p.col)]={raw:String(v??'')};
          if(sh===currentSheetModel()){
            state.cells=sh.cells;
            refreshLiveChange(p.row,p.col);
            loadFx();
          }else markOfflineDirty();
        }
      };
    };
    const sheetByName=name=>{
      const sh=state.sheets.find(s=>String(s.name).toLocaleLowerCase('pt-BR')===String(name).trim().toLocaleLowerCase('pt-BR'));
      if(!sh)throw Error('Planilha não encontrada: '+name);
      return sh;
    };

    return {
      get activeSheetName(){return currentSheetModel()?.name||''},
      listSheets(){return state.sheets.map(s=>s.name)},
      getCell(a){
        return cellForSheet(currentSheetModel(),a);
      },
      getSheet(name){
        const sh=sheetByName(name);
        return {name:sh.name,getCell:a=>cellForSheet(sh,a)};
      },
      setActiveSheet(name){
        const sh=sheetByName(name);
        loadSheetModel(state.sheets.indexOf(sh));
      },
      setColumnWidth(a,w){
        setColWidth(colIndex(a),w);
      },
      select(a){
        const p=parseAddr(a);
        if(p)selectCell(p.row,p.col);
      }
    };
  }

  function refreshMacroSelect(preferredName=''){
    const sel=$('#macroSelect');
    if(!sel)return;
    const preferred=String(preferredName||sel.value||'').toLocaleLowerCase('pt-BR');
    sel.innerHTML='';
    const first=document.createElement('option');
    first.value='';first.textContent=`Macros (${state.macroDefs.length})`;
    sel.appendChild(first);
    state.macroDefs.forEach((m,index)=>{
      const op=document.createElement('option');
      op.value=String(index);op.textContent=m.name;
      sel.appendChild(op);
    });
    const found=state.macroDefs.findIndex(m=>m.name.toLocaleLowerCase('pt-BR')===preferred);
    if(found>=0)sel.value=String(found);
  }

  function runMacro(){
    const rawIndex=$('#macroSelect')?.value??'';
    const index=rawIndex===''?-1:Number(rawIndex);
    const macro=Number.isInteger(index)&&index>=0?state.macroDefs[index]:null;
    if(!macro){status.textContent='Selecione uma macro';return}
    try{
      Function('sheet','"use strict";\n'+macro.code)(macroApi());
      refreshAll();
      loadFx();
      status.textContent=`Macro executada: ${macro.name}`;
    }catch(e){
      alert('Erro na macro: '+e.message);
    }
  }

  function macroEdit(mode='edit'){
    const rawSelected=$('#macroSelect')?.value??'';
    const selected=rawSelected===''?-1:Number(rawSelected);
    const existing=mode==='edit'&&Number.isInteger(selected)&&selected>=0?state.macroDefs[selected]:null;
    if(mode==='edit'&&!existing){status.textContent='Selecione uma macro';return}
    state.editingMacro=existing?selected:null;
    $('#macroEditorTitle').textContent=existing?'Editar macro':'Nova macro';
    $('#macroEditorName').value=existing?.name||'';
    $('#macroEditorCode').value=existing?.code||'';
    $('#macroEditorModal').classList.add('show');
  }

  function macroEditorClose(){
    $('#macroEditorModal')?.classList.remove('show');
    state.editingMacro=null;
  }

  function macroSave(){
    const name=$('#macroEditorName')?.value.trim()||'';
    const code=$('#macroEditorCode')?.value||'';
    if(!name){status.textContent='Digite o nome da macro';return}
    if(!code.trim()){status.textContent='Digite o código da macro';return}
    try{Function('sheet','"use strict";\n'+code)}catch(e){status.textContent='Erro no código: '+e.message;return}
    const editing=state.editingMacro;
    const duplicate=state.macroDefs.findIndex((m,i)=>m.name.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')&&i!==editing);
    if(duplicate>=0){status.textContent='Já existe uma macro com esse nome';return}
    if(editing===null)state.macroDefs.push({name,code});
    else state.macroDefs[editing]={name,code};
    state.macroCode=code;
    markOfflineDirty();
    macroEditorClose();
    refreshMacroSelect(name);
    status.textContent=`Macro salva: ${name}`;
  }

  function macroDelete(){
    const rawIndex=$('#macroSelect')?.value??'';
    const index=rawIndex===''?-1:Number(rawIndex);
    if(!Number.isInteger(index)||index<0||!state.macroDefs[index]){status.textContent='Selecione uma macro';return}
    const name=state.macroDefs[index].name;
    if(!confirm(`Excluir a macro ${name}?`))return;
    state.macroDefs.splice(index,1);
    markOfflineDirty();
    refreshMacroSelect();
    status.textContent=`Macro excluída: ${name}`;
  }

  function macroHelpOpen(){
    $('#macroHelpModal')?.classList.add('show');
  }

  function macroHelpClose(){
    $('#macroHelpModal')?.classList.remove('show');
  }

  async function copyAiHelpPrompt(){
    const area=$('#aiHelpPrompt');
    if(!area)return;
    const value=area.value;

    // First try the synchronous path while the tap is still an active user
    // gesture. This is the path that works most often for offline file://
    // pages and Android WebViews.
    const legacyCopy=()=>{
      const temp=document.createElement('textarea');
      temp.value=value;
      temp.setAttribute('readonly','');
      temp.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;z-index:20000';
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange?.(0,temp.value.length);
      let copied=false;
      try{copied=!!document.execCommand?.('copy')}catch{}
      temp.remove();
      return copied;
    };

    if(legacyCopy()){
      status.textContent='✓ Modelo para IA copiado';
      return;
    }

    try{
      if(navigator.clipboard?.writeText){
        await navigator.clipboard.writeText(value);
        status.textContent='✓ Modelo para IA copiado';
        return;
      }
    }catch{}

    // Last resort for browsers that deliberately block clipboard access on
    // local files: keep the complete prompt selected for a long-press copy.
    area.focus();
    area.select();
    area.setSelectionRange?.(0,value.length);
    area.scrollIntoView({block:'center'});
    area.style.outline='2px solid #9ad09a';
    status.textContent='Área de transferência bloqueada: texto selecionado para copiar';
    alert('O Android bloqueou a cópia automática deste arquivo offline. O modelo ficou selecionado: toque e segure sobre o texto e escolha Copiar.');
  }

  $('#macroHelpModal')?.addEventListener('pointerdown',e=>{
    if(e.target.id==='macroHelpModal')macroHelpClose();
  });
  $('#macroHelpClose')?.addEventListener('click',macroHelpClose);
  $('#macroHelpCopy')?.addEventListener('click',copyAiHelpPrompt);

  $('#macroEditorModal')?.addEventListener('pointerdown',e=>{
    if(e.target.id==='macroEditorModal')macroEditorClose();
  });
  $('#macroEditorSave')?.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();macroSave();
  });
  $('#macroEditorCancel')?.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();macroEditorClose();
  });

$('#customFnModal')?.addEventListener('pointerdown',e=>{
    if(e.target.id==='customFnModal') customFnClose();
  });
  const customFnSaveBtn=$('#customFnSave');
  if(customFnSaveBtn){
    customFnSaveBtn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      e.stopPropagation();
      customFnSave();
    });
  }

  const customFnCancelBtn=$('#customFnCancel');
  if(customFnCancelBtn){
    customFnCancelBtn.addEventListener('pointerdown',e=>{
      e.preventDefault();
      e.stopPropagation();
      customFnClose();
    });
  }

  // Atualizar/reabrir o HTML sempre começa uma pasta limpa. Trabalhos antigos
  // só são recuperados quando o usuário escolhe Arquivo > Abrir e seleciona o JSON.
  try{window.localStorage?.removeItem(OFFLINE_STORAGE_KEY)}catch{}
  state.sheets=[createSheetModel('Planilha1')];
  state.activeSheetIndex=0;
  state.nextSheetNumber=2;
  state.cells=state.sheets[0].cells;
  state.styles=state.sheets[0].styles;
  state.colWidths=state.sheets[0].colWidths;
  state.rowHeights=state.sheets[0].rowHeights;
  state.selected={row:1,col:1};
  state.customFunctionDefs=[];
  state.macroDefs=[];
  state.macroCode='';
  compileCustomFunctions();

  build();
  renderSheetTabs();
  renderRibbon();
  applyViewState();
  $('#decimalKey').textContent=decimalSep();
  $('#decimalKey').dataset.key=decimalSep();
})();
</script>


<div id="printHost" aria-hidden="true"></div>
</body>
</html>
