// Cada vista usa a altura útil do recorte, e não as margens do arquivo.
function prepareProjections(){

 const height=2*(front.bottom-front.top)/front.height,centerY=1-(front.top+front.bottom)/front.height;

function viewWorldWidth(im){return (im.right-im.left)/im.width*viewProjection(im).spanX;}

function cleanSilhouette(im){
const w=im.width,h=im.height,count=w*h,t=+$('cutoff').value,labels=new Int32Array(count),queue=new Int32Array(count),sizes=[0];let largest=0;
for(let k=0;k<count;k++){if(labels[k]||im.pixels[k*4+3]<t)continue;const id=sizes.length;let head=0,tail=0;labels[k]=id;queue[tail++]=k;while(head<tail){const at=queue[head++],x=at%w,y=Math.floor(at/w);for(const next of [x?at-1:-1,x<w-1?at+1:-1,y?at-w:-1,y<h-1?at+w:-1])if(next>=0&&!labels[next]&&im.pixels[next*4+3]>=t){labels[next]=id;queue[tail++]=next;}}sizes.push(tail);largest=Math.max(largest,tail);}

// A orientação é explícita: adicionar costas nunca muda a frente da lateral.
function sideOrientation(){return Number($('sideDirection').value);}

function recalculate(){for(const im of images)if(im)cleanSilhouette(im);sideFacing=sideOrientation();prepareProjections();if(!$('autoDistance').checked)return;for(const [i,id]of [[0,'width'],[1,'depth']]){const im=images[i];if(!im||im.right<=im.left)continue;const value=2*(im.right-im.left)/im.height;$(id).value=value*100;$(id+'Out').value=value.toFixed(3);}if(images[0]&&images[1])$('measurements').textContent='Largura: '+($('width').value/100).toFixed(3)+' · profundidade: '+($('depth').value/100).toFixed(3)+' unidades. Altura do arquivo = 2 unidades. Margens transparentes excluídas.';}
$('autoDistance').onchange=recalculate;
$('sideDirection').onchange=()=>{recalculate();volumeKey='';};
$('sectionMode').onchange=()=>{volumeKey='';};
function paddedTexture(image){const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const data=ctx.getImageData(0,0,c.width,c.height),a=data.data,count=c.width*c.height,seen=new Uint8Array(count),queue=new Int32Array(count);const distance=new Uint16Array(count);for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){const k=y*c.width+x;if(a[k*4+3]>128)distance[k]=x&&y&&x<c.width-1&&y<c.height-1?Math.min(distance[k-1],distance[k-c.width])+1:1;}for(let y=c.height-2;y>=0;y--)for(let x=c.width-2;x>=0;x--){const k=y*c.width+x;if(distance[k])distance[k]=Math.min(distance[k],distance[k+1]+1,distance[k+c.width]+1);}let head=0,tail=0;for(let k=0;k<count;k++)if(distance[k]>=10){seen[k]=1;queue[tail++]=k;}if(!tail)for(let k=0;k<count;k++)if(a[k*4+3]>128){seen[k]=1;queue[tail++]=k;}while(head<tail){const k=queue[head++],x=k%c.width,y=Math.floor(k/c.width);for(const n of [x>0?k-1:-1,x<c.width-1?k+1:-1,y>0?k-c.width:-1,y<c.height-1?k+c.width:-1])if(n>=0&&!seen[n]){seen[n]=1;queue[tail++]=n;for(let channel=0;channel<3;channel++)a[n*4+channel]=a[k*4+channel];}}return data;}
const names=['Frente','Lado','Costas'];
names.forEach((name,i)=>{const l=document.createElement('label');l.className='upload';l.innerHTML=name+'<input type="file" accept="image/png,image/webp,image/jpeg"><span>Aguardando imagem</span>';$('uploads').append(l);l.querySelector('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const image=await createImageBitmap(f);if(!gl)throw Error('WebGL indisponível');if(textures[i])gl.deleteTexture(textures[i]);let t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);const padded=paddedTexture(image);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,padded.width,padded.height,0,gl.RGBA,gl.UNSIGNED_BYTE,padded.data);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);textures[i]=t;images[i]=measure(image);paintStrokes=[];paintUndo=[];activePaintStroke=null;recalculate();volumeKey="";l.querySelector('span').textContent=image.width+' × '+image.height+' px';image.close();$('status').textContent=images.filter(Boolean).length+' de 3 imagens carregadas — silhuetas atualizadas.'}catch(e){$('status').textContent='Erro: '+e.message}}});
