<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        /* Reset e Estilos de Base */
        :root {
            --primary-color: #007bff;
            --accent-color: #28a745;
            --bg-overlay: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container do Player */
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        /* Overlay de Controles */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, var(--bg-overlay));
            display: flex;
            flex-direction: column;
            padding: 10px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .video-container:hover .controls {
            opacity: 1;
        }

        /* Ocultar cursor e controles por inatividade */
        .video-container.hide-controls {
            cursor: none !important;
        }

        .video-container.hide-controls .controls {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .controls.active {
            opacity: 1;
        }

        /* Barra de Progresso */
        .progress-area {
            height: 8px;
            width: 100%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            margin: 12px 0 10px;
            border-radius: 5px;
            position: relative;
            touch-action: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 5px;
            position: relative;
        }

        .trim-selection {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(40, 167, 69, 0.42);
            pointer-events: none;
        }

        .trim-handle {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 28px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 4px;
            background: var(--accent-color);
            transform: translate(-50%, -50%);
            cursor: ew-resize;
            z-index: 2;
            touch-action: none;
        }

        .trim-handle:hover {
            transform: translate(-50%, -50%) scale(1.08);
            opacity: 1;
        }

        .trim-info {
            color: #fff;
            font-size: 12px;
            min-height: 16px;
            text-align: center;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.55;
            transform: none;
        }

        /* Botões e Inputs */
        .buttons-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
        }

        .main-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        button.active {
            color: var(--accent-color);
            filter: drop-shadow(0 0 12px var(--accent-color));
            background: rgba(40, 167, 69, 0.2);
            border-radius: 4px;
        }

        select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 2px 5px;
            cursor: pointer;
            outline: none;
            font-size: 12px;
        }

        select option {
            background: #1a1a1a;
        }

        .time-display {
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
        }

        input[type="range"] {
            cursor: pointer;
            width: 80px;
        }
    </style>
</head>
<body>

<div class="video-container" id="videoContainer">
    <video id="mainVideo"></video>
    
    <div class="controls">
        <div class="progress-area" id="progressArea">
            <div class="progress-bar" id="progressBar"></div>
            <div class="trim-selection" id="trimSelection"></div>
            <button class="trim-handle" id="trimStartHandle" title="Arraste para definir o início"></button>
            <button class="trim-handle" id="trimEndHandle" title="Arraste para definir o fim"></button>
        </div>
        <div class="trim-info" id="trimInfo">Corte: 0:00 até 0:00</div>
        
        <div class="buttons-container">
            <div class="main-controls">
                <button id="playPauseBtn">▶</button>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
                <button id="muteBtn">🔊</button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
            </div>
            
            <div class="right-controls" style="display: flex; align-items: center; gap: 10px;">
                <input type="file" id="fileInput" accept="video/*" style="display: none;">
                <button id="loadBtn" title="Abrir vídeo">📂</button>
                <button id="photoBtn" title="Salvar frame atual como imagem">📷 Foto</button>
                <button id="downloadClipBtn" title="Baixar somente o trecho selecionado">✂ Baixar corte</button>
                <button id="downloadAudioBtn" title="Baixar somente o áudio do trecho selecionado">🎵 Áudio</button>
                <button id="loopBtn" title="Repetir">🔁</button>
                <select id="speedSelect" title="Velocidade">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
                <button id="fullScreenBtn">⛶</button>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressArea = document.getElementById('progressArea');
    const progressBar = document.getElementById('progressBar');
    const trimSelection = document.getElementById('trimSelection');
    const trimStartHandle = document.getElementById('trimStartHandle');
    const trimEndHandle = document.getElementById('trimEndHandle');
    const trimInfo = document.getElementById('trimInfo');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const muteBtn = document.getElementById('muteBtn');
    const fullScreenBtn = document.getElementById('fullScreenBtn');
    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    const photoBtn = document.getElementById('photoBtn');
    const downloadClipBtn = document.getElementById('downloadClipBtn');
    const downloadAudioBtn = document.getElementById('downloadAudioBtn');
    const loopBtn = document.getElementById('loopBtn');
    const speedSelect = document.getElementById('speedSelect');
    const videoContainer = document.getElementById('videoContainer');
    let controlsTimer;
    let trimStart = 0;
    let trimEnd = 0;
    let isExporting = false;

    // Gerenciamento de exibição dos controles (Inatividade)
    function resetControlsTimer() {
        videoContainer.classList.remove('hide-controls');
        clearTimeout(controlsTimer);
        // Só inicia o timer para esconder se o vídeo estiver rodando
        if (!video.paused) {
            controlsTimer = setTimeout(() => {
                videoContainer.classList.add('hide-controls');
            }, 3000);
        }
    }

    videoContainer.addEventListener('mousemove', resetControlsTimer);

    video.addEventListener('pause', () => {
        videoContainer.classList.remove('hide-controls');
        clearTimeout(controlsTimer);
    });

    // Monitorar entrada e saída de tela cheia para esconder controles imediatamente
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            // Se entrou em tela cheia e o vídeo está rodando, inicia o timer
            resetControlsTimer();
        } else {
            // Ao sair do modo maximizado, garante que os controles voltem
            videoContainer.classList.remove('hide-controls');
            clearTimeout(controlsTimer);
        }
    });

    // Toggle Play/Pause
    function togglePlay() {
        if (video.paused) {
            // Se estiver fora da seleção ou no fim dela, reinicia no começo do corte.
            if (video.currentTime < trimStart || video.currentTime >= trimEnd - 0.03) {
                video.currentTime = trimStart;
            }
            video.play();
        } else {
            video.pause();
        }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    // Sincronizar ícone de Play/Pause automaticamente
    video.addEventListener('play', () => playPauseBtn.textContent = '⏸');
    video.addEventListener('pause', () => playPauseBtn.textContent = '▶');

    // Atualizar Barra de Progresso
    video.addEventListener('timeupdate', () => {
        const percentage = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${percentage}%`;
        
        // Atualizar tempo formatado
        currentTimeEl.textContent = formatTime(video.currentTime);

        // Na visualização normal, nunca reproduz além das alças do corte.
        if (!isExporting && trimEnd > trimStart && video.currentTime >= trimEnd) {
            if (video.loop) {
                video.currentTime = trimStart;
                video.play().catch(() => {});
            } else {
                video.pause();
                video.currentTime = trimEnd;
            }
        }
    });

    // Carregar Duração
    video.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(video.duration);
        trimStart = 0;
        trimEnd = video.duration;
        updateTrimUI();
    });

    // Seek (Pular para parte do vídeo)
    progressArea.addEventListener('click', (e) => {
        if (e.target.classList.contains('trim-handle')) return;
        const areaWidth = progressArea.clientWidth;
        const clickX = e.clientX - progressArea.getBoundingClientRect().left;
        const duration = video.duration;
        const clickedTime = (clickX / areaWidth) * duration;
        video.currentTime = Math.max(trimStart, Math.min(trimEnd, clickedTime));
    });

    function updateTrimUI() {
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        const startPercent = (trimStart / video.duration) * 100;
        const endPercent = (trimEnd / video.duration) * 100;
        trimStartHandle.style.left = `${startPercent}%`;
        trimEndHandle.style.left = `${endPercent}%`;
        trimSelection.style.left = `${startPercent}%`;
        trimSelection.style.right = `${100 - endPercent}%`;
        trimInfo.textContent = `Corte: ${formatTime(trimStart)} até ${formatTime(trimEnd)} (${formatTime(trimEnd - trimStart)})`;
    }

    function enableTrimDrag(handle, edge) {
        handle.addEventListener('pointerdown', (event) => {
            if (!Number.isFinite(video.duration)) return;
            event.preventDefault();
            event.stopPropagation();
            handle.setPointerCapture(event.pointerId);
        });

        handle.addEventListener('pointermove', (event) => {
            if (!handle.hasPointerCapture(event.pointerId)) return;
            const rect = progressArea.getBoundingClientRect();
            const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            const time = percent * video.duration;
            const minimumGap = Math.min(0.1, video.duration);

            if (edge === 'start') {
                trimStart = Math.min(time, trimEnd - minimumGap);
                video.currentTime = trimStart;
            } else {
                trimEnd = Math.max(time, trimStart + minimumGap);
                video.currentTime = trimEnd;
            }
            updateTrimUI();
        });
    }

    enableTrimDrag(trimStartHandle, 'start');
    enableTrimDrag(trimEndHandle, 'end');

    // Volume
    volumeSlider.addEventListener('input', (e) => {
        video.volume = e.target.value;
        muteBtn.textContent = video.volume === 0 ? '🔇' : '🔊';
    });

    // Abrir arquivo local
    loadBtn.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            video.src = url;
            // Garante que o estado do loop seja aplicado ao novo vídeo
            video.loop = loopBtn.classList.contains('active');
            video.playbackRate = parseFloat(speedSelect.value);
            video.play();
            playPauseBtn.textContent = '⏸';
        }
    });

    // Salvar o frame atual do vídeo como uma imagem PNG
    photoBtn.addEventListener('click', () => {
        if (!video.src || video.readyState < 2 || !video.videoWidth) {
            alert('Abra um vídeo e aguarde a imagem aparecer antes de tirar a foto.');
            return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
            if (!blob) {
                alert('Não foi possível salvar este frame.');
                return;
            }

            const frameTime = Math.floor(video.currentTime * 1000);
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `frame-${frameTime}ms.png`;
            link.click();
            URL.revokeObjectURL(link.href);
        }, 'image/png');
    });

    // Exporta o intervalo marcado como vídeo ou somente áudio, em tempo real.
    async function exportSelection(audioOnly = false) {
        if (!video.src || !Number.isFinite(video.duration) || isExporting) {
            if (!video.src) alert('Abra um vídeo antes de fazer o corte.');
            return;
        }

        const captureStream = video.captureStream || video.mozCaptureStream;
        if (!captureStream || typeof MediaRecorder === 'undefined') {
            alert('Seu navegador não suporta a exportação. Use uma versão recente do Chrome ou Edge.');
            return;
        }

        isExporting = true;
        downloadClipBtn.disabled = true;
        downloadAudioBtn.disabled = true;
        const oldTime = video.currentTime;
        const oldRate = video.playbackRate;
        const oldLoop = video.loop;
        const wasPaused = video.paused;

        try {
            video.pause();
            video.loop = false;
            video.playbackRate = 1;
            if (Math.abs(video.currentTime - trimStart) > 0.01) {
                await new Promise((resolve) => {
                    video.addEventListener('seeked', resolve, { once: true });
                    video.currentTime = trimStart;
                });
            } else {
                video.currentTime = trimStart;
            }

            const capturedStream = captureStream.call(video);
            const stream = audioOnly
                ? new MediaStream(capturedStream.getAudioTracks())
                : capturedStream;
            if (audioOnly && stream.getAudioTracks().length === 0) {
                throw new Error('O vídeo não possui uma faixa de áudio disponível.');
            }

            const mimeTypes = audioOnly
                ? ['audio/webm;codecs=opus', 'audio/webm']
                : ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
            const mimeType = mimeTypes.find((type) => MediaRecorder.isTypeSupported(type)) || '';
            const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
            const chunks = [];
            recorder.addEventListener('dataavailable', (event) => {
                if (event.data.size) chunks.push(event.data);
            });

            const finished = new Promise((resolve) => recorder.addEventListener('stop', resolve, { once: true }));
            const stopAtEnd = () => {
                trimInfo.textContent = `Exportando: ${formatTime(Math.max(0, video.currentTime - trimStart))} / ${formatTime(trimEnd - trimStart)}`;
                if (video.currentTime >= trimEnd || video.ended) {
                    video.pause();
                    if (recorder.state !== 'inactive') recorder.stop();
                }
            };

            video.addEventListener('timeupdate', stopAtEnd);
            recorder.start(250);
            await video.play();
            await finished;
            video.removeEventListener('timeupdate', stopAtEnd);

            const fallbackType = audioOnly ? 'audio/webm' : 'video/webm';
            const blob = new Blob(chunks, { type: recorder.mimeType || fallbackType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            const fileType = audioOnly ? 'audio' : 'video-cortado';
            link.download = `${fileType}-${Math.floor(trimStart * 1000)}-${Math.floor(trimEnd * 1000)}.webm`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        } catch (error) {
            console.error(error);
            alert(error.message || 'Não foi possível exportar o corte deste vídeo.');
        } finally {
            video.pause();
            video.currentTime = oldTime;
            video.playbackRate = oldRate;
            video.loop = oldLoop;
            if (!wasPaused) video.play().catch(() => {});
            isExporting = false;
            downloadClipBtn.disabled = false;
            downloadAudioBtn.disabled = false;
            updateTrimUI();
        }
    }

    downloadClipBtn.addEventListener('click', () => exportSelection(false));
    downloadAudioBtn.addEventListener('click', () => exportSelection(true));

    // Controle de Velocidade
    speedSelect.addEventListener('change', () => {
        video.playbackRate = parseFloat(speedSelect.value);
    });

    // Toggle Loop
    loopBtn.addEventListener('click', () => {
        video.loop = !video.loop;
        loopBtn.classList.toggle('active', video.loop);
        loopBtn.title = video.loop ? "Repetir: Ligado" : "Repetir: Desligado";
        
        // Feedback imediato: se o vídeo acabou e ligou o loop, ele recomeça
        if (video.loop && video.ended) {
            video.play();
            playPauseBtn.textContent = '⏸';
        }
    });

    // Fullscreen
    fullScreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            videoContainer.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    // Suporte à tecla ESC para sair do modo tela cheia
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.fullscreenElement) {
            document.exitFullscreen();
        }
    });

    // Formatar Segundos em MM:SS
    function formatTime(time) {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
    }
</script>

</body>
</html>
