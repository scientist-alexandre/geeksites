<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        /* Reset e Estilos de Base */
        :root {
            --primary-color: #007bff;
            --accent-color: #28a745;
            --bg-overlay: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container do Player */
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        /* Overlay de Controles */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, var(--bg-overlay));
            display: flex;
            flex-direction: column;
            padding: 10px;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .video-container:hover .controls {
            opacity: 1;
        }

        /* Ocultar cursor e controles por inatividade */
        .video-container.hide-controls {
            cursor: none !important;
        }

        .video-container.hide-controls .controls {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .controls.active {
            opacity: 1;
        }

        /* Barra de Progresso */
        .progress-area {
            height: 8px;
            width: 100%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            margin: 12px 0 10px;
            border-radius: 5px;
            position: relative;
            touch-action: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 5px;
            position: relative;
        }

        .trim-selection {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(40, 167, 69, 0.42);
            pointer-events: none;
        }

        .trim-handle {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 28px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 4px;
            background: var(--accent-color);
            transform: translate(-50%, -50%);
            cursor: ew-resize;
            z-index: 2;
            touch-action: none;
        }

        .trim-handle:hover {
            transform: translate(-50%, -50%) scale(1.08);
            opacity: 1;
        }

        .trim-info {
            color: #fff;
            font-size: 12px;
            min-height: 16px;
            text-align: center;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.55;
            transform: none;
        }

        /* Botões e Inputs */
        .buttons-container {
            flex-wrap: wrap;
            gap: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
        }

        .main-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        button.active {
            color: var(--accent-color);
            filter: drop-shadow(0 0 12px var(--accent-color));
            background: rgba(40, 167, 69, 0.2);
            border-radius: 4px;
        }

        select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 2px 5px;
            cursor: pointer;
            outline: none;
            font-size: 12px;
        }

        select option {
            background: #1a1a1a;
        }

        .time-display {
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            min-width: 100px;
        }

        input[type="range"] {
            cursor: pointer;
            width: 80px;
        }
        .right-controls { flex-wrap: wrap; justify-content: flex-end; }
        .controls:focus-within { opacity: 1; }
    </style>
</head>
<body>

<div class="video-container" id="videoContainer">
    <video id="mainVideo" playsinline></video>
    <div id="exportStatus" role="status" aria-live="polite" style="position:absolute;top:12px;left:12px;color:white;background:#222c;padding:8px;border-radius:5px">Abra um vídeo pela pasta 📂.</div>
    
    <div class="controls">
        <div class="progress-area" id="progressArea">
            <div class="progress-bar" id="progressBar"></div>
            <div class="trim-selection" id="trimSelection"></div>
            <button class="trim-handle" id="trimStartHandle" title="Arraste para definir o início"></button>
            <button class="trim-handle" id="trimEndHandle" title="Arraste para definir o fim"></button>
        </div>
        <div class="trim-info" id="trimInfo">Corte: 0:00 até 0:00</div>
        
        <div class="buttons-container">
            <div class="main-controls">
                <button id="playPauseBtn">▶</button>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
                <button id="muteBtn">🔊</button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
            </div>
            
            <div class="right-controls" style="display: flex; align-items: center; gap: 10px;">
                <input type="file" id="fileInput" accept="video/*" style="display: none;">
                <button id="loadBtn" title="Abrir vídeo">📂</button>
                <button id="photoBtn" title="Salvar frame atual como imagem">📷 Foto</button>
                <button id="downloadClipBtn" title="Baixar somente o trecho selecionado">✂ Baixar corte</button>
                <button id="downloadAudioBtn" title="Baixar somente o áudio do trecho selecionado">🎵 Áudio</button>
                <button id="loopBtn" title="Repetir">🔁</button>
                <select id="speedSelect" title="Velocidade">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
                <button id="fullScreenBtn">⛶</button>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('mainVideo');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const progressArea = document.getElementById('progressArea');
    const progressBar = document.getElementById('progressBar');
    const trimSelection = document.getElementById('trimSelection');
    const trimStartHandle = document.getElementById('trimStartHandle');
    const trimEndHandle = document.getElementById('trimEndHandle');
    const trimInfo = document.getElementById('trimInfo');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volumeSlider');
    const muteBtn = document.getElementById('muteBtn');
    const fullScreenBtn = document.getElementById('fullScreenBtn');
    const fileInput = document.getElementById('fileInput');
    const loadBtn = document.getElementById('loadBtn');
    const photoBtn = document.getElementById('photoBtn');
    const downloadClipBtn = document.getElementById('downloadClipBtn');
    const downloadAudioBtn = document.getElementById('downloadAudioBtn');
    const loopBtn = document.getElementById('loopBtn');
    const speedSelect = document.getElementById('speedSelect');
    const videoContainer = document.getElementById('videoContainer');
    let controlsTimer;
    let trimStart = 0;
    let trimEnd = 0;
    let isExporting = false;
    let sourceURL;
    let sourceFile;
    const exportStatus = document.getElementById('exportStatus');
    function saveBlob(blob, filename) {
        if (!blob || !blob.size) throw new Error('O arquivo gerado está vazio.');
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    function waitMedia(element, event, action) {
        return new Promise((resolve, reject) => {
            const timeout = setTimeout(() => done(new Error('Tempo esgotado ao preparar o vídeo.')), 15000);
            const success = () => done();
            const failure = () => done(new Error('Não foi possível ler este vídeo.'));
            function done(error) {
                clearTimeout(timeout);
                element.removeEventListener(event, success);
                element.removeEventListener('error', failure);
                error ? reject(error) : resolve();
            }
            element.addEventListener(event, success, {once:true});
            element.addEventListener('error', failure, {once:true});
            try { action(); } catch(error) { done(error); }
        });
    }

    // Gerenciamento de exibição dos controles (Inatividade)
    function resetControlsTimer() {
        videoContainer.classList.remove('hide-controls');
        clearTimeout(controlsTimer);
        // Só inicia o timer para esconder se o vídeo estiver rodando
        if (!video.paused && !isExporting) {
            controlsTimer = setTimeout(() => {
                videoContainer.classList.add('hide-controls');
            }, 3000);
        }
    }

    videoContainer.addEventListener('mousemove', resetControlsTimer);

    video.addEventListener('pause', () => {
        videoContainer.classList.remove('hide-controls');
        clearTimeout(controlsTimer);
    });

    // Monitorar entrada e saída de tela cheia para esconder controles imediatamente
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            // Se entrou em tela cheia e o vídeo está rodando, inicia o timer
            resetControlsTimer();
        } else {
            // Ao sair do modo maximizado, garante que os controles voltem
            videoContainer.classList.remove('hide-controls');
            clearTimeout(controlsTimer);
        }
    });

    // Toggle Play/Pause
    function togglePlay() {
        if (!video.src) return;
        if (video.paused) {
            // Se estiver fora da seleção ou no fim dela, reinicia no começo do corte.
            if (video.currentTime < trimStart || video.currentTime >= trimEnd - 0.03) {
                video.currentTime = trimStart;
            }
            video.play().catch(error => exportStatus.textContent = error.message);
        } else {
            video.pause();
        }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    // Sincronizar ícone de Play/Pause automaticamente
    video.addEventListener('play', () => playPauseBtn.textContent = '⏸');
    video.addEventListener('pause', () => playPauseBtn.textContent = '▶');

    // Atualizar Barra de Progresso
    video.addEventListener('timeupdate', () => {
        const percentage = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${percentage}%`;
        
        // Atualizar tempo formatado
        currentTimeEl.textContent = formatTime(video.currentTime);

        // Na visualização normal, nunca reproduz além das alças do corte.
        if (!isExporting && trimEnd > trimStart && video.currentTime >= trimEnd) {
            if (video.loop) {
                video.currentTime = trimStart;
                video.play().catch(() => {});
            } else {
                video.pause();
                video.currentTime = trimEnd;
            }
        }
    });

    // Carregar Duração
    video.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(video.duration);
        trimStart = 0;
        trimEnd = video.duration;
        updateTrimUI();
    });

    // Seek (Pular para parte do vídeo)
    progressArea.addEventListener('click', (e) => {
        if (e.target.classList.contains('trim-handle')) return;
        const areaWidth = progressArea.clientWidth;
        const clickX = e.clientX - progressArea.getBoundingClientRect().left;
        const duration = video.duration;
        const clickedTime = (clickX / areaWidth) * duration;
        video.currentTime = Math.max(trimStart, Math.min(trimEnd, clickedTime));
    });

    function updateTrimUI() {
        if (!Number.isFinite(video.duration) || video.duration <= 0) return;
        const startPercent = (trimStart / video.duration) * 100;
        const endPercent = (trimEnd / video.duration) * 100;
        trimStartHandle.style.left = `${startPercent}%`;
        trimEndHandle.style.left = `${endPercent}%`;
        trimSelection.style.left = `${startPercent}%`;
        trimSelection.style.right = `${100 - endPercent}%`;
        trimInfo.textContent = `Corte: ${formatTime(trimStart)} até ${formatTime(trimEnd)} (${formatTime(trimEnd - trimStart)})`;
    }

    function enableTrimDrag(handle, edge) {
        handle.addEventListener('pointerdown', (event) => {
            if (isExporting || !Number.isFinite(video.duration)) return;
            event.preventDefault();
            event.stopPropagation();
            handle.setPointerCapture(event.pointerId);
        });

        handle.addEventListener('pointermove', (event) => {
            if (!handle.hasPointerCapture(event.pointerId)) return;
            const rect = progressArea.getBoundingClientRect();
            const percent = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            const time = percent * video.duration;
            const minimumGap = Math.min(0.1, video.duration);

            if (edge === 'start') {
                trimStart = Math.min(time, trimEnd - minimumGap);
                video.currentTime = trimStart;
            } else {
                trimEnd = Math.max(time, trimStart + minimumGap);
                video.currentTime = trimEnd;
            }
            updateTrimUI();
        });
    }

    enableTrimDrag(trimStartHandle, 'start');
    enableTrimDrag(trimEndHandle, 'end');

    // Volume
    volumeSlider.addEventListener('input', (e) => {
        video.volume = e.target.value;
        video.muted = false;
        muteBtn.textContent = video.volume === 0 ? '🔇' : '🔊';
    });

    // Abrir arquivo local
    loadBtn.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            video.pause();
            sourceFile = file;
            if (sourceURL) URL.revokeObjectURL(sourceURL);
            const url = sourceURL = URL.createObjectURL(file);
            exportStatus.textContent = file.name;
            video.src = url;
            // Garante que o estado do loop seja aplicado ao novo vídeo
            video.loop = loopBtn.classList.contains('active');
            video.playbackRate = parseFloat(speedSelect.value);
            video.play().catch(() => { exportStatus.textContent = 'Vídeo aberto. Pressione ▶ para reproduzir.'; });
            playPauseBtn.textContent = '⏸';
        }
    });

    // Salvar o frame atual do vídeo como uma imagem PNG
    photoBtn.addEventListener('click', () => {
        if (!video.src || video.readyState < 2 || !video.videoWidth) {
            alert('Abra um vídeo e aguarde a imagem aparecer antes de tirar a foto.');
            return;
        }

        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
            if (!blob) {
                alert('Não foi possível salvar este frame.');
                return;
            }

            const frameTime = Math.floor(video.currentTime * 1000);
            saveBlob(blob, `frame-${frameTime}ms.png`);
            exportStatus.textContent = 'Foto PNG enviada para Downloads.';
        }, 'image/png');
    });

    const processorSource = "\nlet engine;\nself.onmessage = async ({data}) => {\n try {\n  if (data.type === 'init') {\n   engine = await createFFmpegCore({wasmBinary:data.wasm});\n   engine.setLogger(({message}) => self.postMessage({type:'log',message}));\n   engine.setProgress(({time}) => self.postMessage({type:'progress',time}));\n   self.postMessage({type:'ready'});\n  } else {\n   engine.FS.writeFile('input',data.input);\n   engine.exec('-nostdin','-y',...data.args);\n   if(engine.ret !== 0) throw new Error('Falha ao processar o arquivo. Verifique se h\u00e1 \u00e1udio e se o formato \u00e9 compat\u00edvel.');\n   const output=engine.FS.readFile(data.output);\n   self.postMessage({type:'done',output},[output.buffer]);\n  }\n } catch(error) { self.postMessage({type:'error',message:String(error)}); }\n};\n";
    let processorAssets;
    async function loadProcessorAssets() {
        if (!processorAssets) {
            processorAssets = (async () => {
                const base = 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd/';
                const responses = await Promise.all([
                    fetch(base + 'ffmpeg-core.js', {signal: AbortSignal.timeout(120000)}),
                    fetch(base + 'ffmpeg-core.wasm', {signal: AbortSignal.timeout(120000)})
                ]);
                if (responses.some(response => !response.ok)) throw new Error('Não foi possível baixar o processador. Verifique sua conexão e tente novamente.');
                const [js, wasm] = await Promise.all([responses[0].text(), responses[1].arrayBuffer()]);
                return {js, wasm};
            })().catch(error => { processorAssets = null; throw error; });
        }
        return processorAssets;
    }
    // FFmpeg roda num worker local: nenhuma reprodução ou envio de vídeo.
    async function processSelection(audioOnly = false) {
        if (isExporting) return;
        if (!sourceFile || !Number.isFinite(video.duration)) {
            exportStatus.textContent = 'Abra um vídeo e aguarde o carregamento.';
            return;
        }
        const start = trimStart, duration = trimEnd - trimStart;
        if (!(duration > 0)) return;
        isExporting = true;
        const controls = [downloadClipBtn, downloadAudioBtn, loadBtn, fileInput, trimStartHandle, trimEndHandle];
        controls.forEach(control => control.disabled = true);
        let worker, workerURL;
        try {
            exportStatus.textContent = 'Carregando processador pela internet (cerca de 31 MB na primeira vez)…';
            await new Promise(resolve => setTimeout(resolve, 0));
            const assets = await loadProcessorAssets();
            workerURL = URL.createObjectURL(new Blob([assets.js, '\n', processorSource], {type:'application/javascript'}));
            worker = new Worker(workerURL);
            const output = audioOnly ? 'output.mp3' : 'output.mp4';
            let lastLog = '';
            const result = new Promise((resolve, reject) => {
                worker.onerror = event => reject(new Error(event.message || 'Falha no processador local.'));
                worker.onmessage = async ({data}) => {
                    try {
                        if (data.type === 'error') reject(new Error(data.message + (lastLog ? ' '+lastLog : '')));
                        if (data.type === 'log') lastLog = data.message;
                        if (data.type === 'progress') {
                            const percent = Math.min(99, Math.max(0, Math.round(data.time / 1000000 / duration * 100)));
                            exportStatus.textContent = `Processando ${audioOnly ? 'áudio' : 'corte'}: ${percent}%`;
                        }
                        if (data.type === 'ready') {
                            exportStatus.textContent = 'Lendo arquivo e processando…';
                            const input = new Uint8Array(await sourceFile.arrayBuffer());
                            const args = ['-i','input','-ss',String(start),'-t',String(duration)];
                            if (audioOnly) args.push('-map','0:a:0','-vn','-c:a','libmp3lame','-q:a','2');
                            else args.push('-map','0:v:0','-map','0:a:0?','-c:v','libx264','-preset','ultrafast','-crf','20','-pix_fmt','yuv420p','-c:a','aac','-b:a','192k','-movflags','+faststart');
                            args.push(output);
                            worker.postMessage({type:'run',input,args,output},[input.buffer]);
                        }
                        if (data.type === 'done') resolve(data.output);
                    } catch(error) { reject(error); }
                };
            });
            const wasm = new Uint8Array(assets.wasm.slice(0));
            worker.postMessage({type:'init',wasm},[wasm.buffer]);
            const data = await result;
            saveBlob(new Blob([data],{type:audioOnly ? 'audio/mpeg' : 'video/mp4'}), `${audioOnly ? 'audio' : 'video-cortado'}-${Math.round(start*1000)}-${Math.round(trimEnd*1000)}.${audioOnly ? 'mp3' : 'mp4'}`);
            exportStatus.textContent = `${audioOnly ? 'Áudio MP3' : 'Corte MP4'} enviado para Downloads, sem reproduzir o vídeo.`;
        } catch(error) {
            console.error(error);
            exportStatus.textContent = error.message === 'Failed to fetch' ? 'Não foi possível carregar o processador. Conecte-se à internet e tente novamente.' : (error.message || 'Falha no processamento. Tente um arquivo menor.');
        } finally {
            worker?.terminate();
            if (workerURL) URL.revokeObjectURL(workerURL);
            isExporting = false;
            controls.forEach(control => control.disabled = false);
        }
    }

    downloadClipBtn.addEventListener('click', () => processSelection(false));
    downloadAudioBtn.addEventListener('click', () => processSelection(true));

    // Controle de Velocidade
    speedSelect.addEventListener('change', () => {
        video.playbackRate = parseFloat(speedSelect.value);
    });

    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? '🔇' : '🔊';
    });

    // Toggle Loop
    loopBtn.addEventListener('click', () => {
        video.loop = !video.loop;
        loopBtn.classList.toggle('active', video.loop);
        loopBtn.title = video.loop ? "Repetir: Ligado" : "Repetir: Desligado";
        
        // Feedback imediato: se o vídeo acabou e ligou o loop, ele recomeça
        if (video.loop && video.ended) {
            video.play();
            playPauseBtn.textContent = '⏸';
        }
    });

    // Fullscreen
    fullScreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            videoContainer.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    // Suporte à tecla ESC para sair do modo tela cheia
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.fullscreenElement) {
            document.exitFullscreen();
        }
    });

    // Formatar Segundos em MM:SS
    function formatTime(time) {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
    }
</script>

</body>
</html>
